{% extends "common.html" %}
{% block title %}Attraction{% endblock %}

{% block mainbody %}
<hr class="separator"/>
<div id="section-area">
	<div id="section">
		<div id="picture-current">
			<img id="attr-page-left-button" class="mouseover" src="/left_arrow_noBack.png" onclick="pushImageSlide(-1)"/>
			<img id="attr-page-right-button" class="mouseover" src="/right_arrow_noBack.png" onclick="pushImageSlide(1)"/>
			<div id="circle-set-area">
				<div id="circle-set"></div>
			</div>
		</div>
		<div id="profile">
			<div id="name" class="head-title"></div>
			<div id="cate-mrt"></div>
			<div id="booking-form">
				<div id="order-headline" class="form-headline">Booking a tour</div>
				<div id="order-description" class="form-description">
					A day trip centered around this landmark</div>
				<div id="date-field">
					<div id="date-headline" class="form-headline">Date</div>
					<div id="date-input-area">
						<input type="date" id="calendar" name="date">
					</div>
				</div>
				<div id="time-field">
					<div id="time-headline" class="form-headline">Time</div>
					<div id="morning" class="radio-select-area">
						<div id="morning-button" class="time-button">
							<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
								<g clip-path="url(#clip0_3_336)">
									<circle cx="11" cy="11" r="11" fill="white"/>
									<circle id="morning-select" cx="11" cy="11" r="9" fill="#448899"/>
								</g>
								<defs>
									<clipPath id="clip0_3_336">
									<rect width="22" height="22" fill="white"/>
									</clipPath>
								</defs>
							</svg>
						</div>
						<div class="form-headline">Morning</div>
					</div>
					<div id="afternoon" class="radio-select-area">
						<div id="afternoon-button" class="time-button">
							<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
								<g clip-path="url(#clip0_3_336)">
									<circle cx="11" cy="11" r="11" fill="white"/>
									<circle id="afternoon-select" cx="11" cy="11" r="9" fill="#448899"/>
								</g>
								<defs>
									<clipPath id="clip0_3_336">
									<rect width="22" height="22" fill="white"/>
									</clipPath>
								</defs>
							</svg>
						</div>
						<div class="form-headline">Afternoon</div>
					</div>
				</div>
				<div id="price-field">
					<div id="price-headline" class="form-headline">Fee</div>
					<div id="price-description" class="form-description"></div>
				</div>
				<div id="booking-field">
					<div id="booking-button" class="mouseover">
						<div class="button-text">Book</div>
					</div>
					<div id="booking-button-remain"></div>
				</div>
			</div>
		</div>
	</div>
</div>
<hr id="section-separator" class="separator"/>
<div id="infors-area">
	<div id="infors">
		<div id="description" class="infors-description"></div>
		<div id="address" class="infor-headline">Address </div>
		<div id="address-content" class="infors-description"></div>
		<div id="transport" class="infor-headline">Transportation </div>
		<div id="transport-content" class="infors-description"></div>
	</div>
</div>
<div id="loading">
	<img id="loading-picture" src="/loading2.gif" />
</div>
{% endblock %}

{% block scripsetting %}
<script src="/JS/attraction.js"></script>
<script>initAttraction();</script>
{% endblock %}
