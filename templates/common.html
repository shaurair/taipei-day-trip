<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale = 1.0" />
		<meta charset="utf-8" />
		<title>{% block title %}{% endblock %}</title>
		<link rel="stylesheet" type="text/css" href="/style.css"/>
	</head>
	<body>
		<div class="sign-mask"></div>
		<div id="navigation">
			<div id="nav-content">
				<a href="/" class="hyperlink mouseover"><div id="headline">Taipei Trip</div></a>
				<div id="opt-menu">
					<div id="opt-sche" class="mouseover">Booking</div>
					<div id="opt-sign" class="mouseover">Login</div>
					<div id="opt-member" class="mouseover"></div>
					<div id="opt-sign-loading"></div>
				</div>
			</div>
		</div>
		<div class="sign-area">
			<div class="sign-area-position">
				<div class="sign-decorator"></div>
				<div class="sign-in-main">
					<div class="sign-main-title">Sign in</div>
					<div class="sign-box">
						<input type="text" id="email" class="sign-input-text" placeholder="Email"/>
					</div>
					<div class="sign-box">
						<input type="password" id="password" class="sign-input-text" placeholder="Password"/>
					</div>
					<div class="sign-btn" id="sign-in-btn" >
						<div class="sign-btn-text">Sign in</div>
					</div>
					<div class="sign-message" id="sign-in-message"></div>
					<div class="sign-switch" id="go-sign-up-btn">Click here to sign up.</div>
				</div>
				<div class="sign-up-main">
					<div class="sign-main-title">Sign up</div>
					<div class="sign-box">
						<input type="text" id="sign-name" class="sign-input-text" placeholder="Name"/>
					</div>
					<div class="sign-box">
						<input type="text" id="sign-email" class="sign-input-text" placeholder="Email"/>
					</div>
					<div class="sign-box">
						<input type="password" id="sign-password" class="sign-input-text" placeholder="Password"/>
					</div>
					<div class="sign-btn" id="sign-up-btn" >
						<div class="sign-btn-text">Sign up</div>
					</div>
					<div class="sign-message" id="sign-up-message"></div>
					<div class="sign-switch" id="go-sign-in-btn">Click here to sign in.</div>
				</div>
				<div class="sign-close">
					<div class="close-icon"></div>
				</div>
			</div>
		</div>
		<div class="member-selection">
			<div class="member-position">
				<div id="opt-member-center" class="member-selection-item mouseover">
					<div class="selection-item-text">Account</div>
				</div>
				<hr class="separator"/>
				<div id="opt-sign-out" class="member-selection-item mouseover">
					<div class="selection-item-text">Sign out</div>
				</div>
			</div>
		</div>
		{% block mainbody %}{% endblock %}
		<div id="footer">
			<div id="footer-content">
				<div id="footer-text">COPYRIGHT © 2024 Taipei Trip</div>
			</div>
		</div>
		<script src="/JS/log.js"></script>
		{% block scripsetting %}{% endblock %}
	</body>
</html>
